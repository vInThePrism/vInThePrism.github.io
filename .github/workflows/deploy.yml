name: Deploy to GitHub Pages

on:
  # Build and deploy on every push to main
  push:
    branches: [main]
  # Daily rebuild to sync notes and the GitHub repo list (13:17 UTC ≈ 8 AM Chicago)
  schedule:
    - cron: "17 13 * * *"
  # Manual "Run workflow" button on the Actions tab
  workflow_dispatch:
  # Lets the notes repo trigger an immediate rebuild via the API (see README)
  repository_dispatch:
    types: [notes-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v7

      # Check out the notes repo. While it is private, add a NOTES_TOKEN secret
      # (fine-grained token with Contents: Read on vInThePrism/notes).
      # Not needed once the notes repo is public. A failure here never blocks the deploy.
      - name: Checkout notes
        id: notes
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: vInThePrism/notes
          path: .notes
          fetch-depth: 0
          token: ${{ secrets.NOTES_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: vInThePrism
          NOTES_DIR: ${{ steps.notes.outcome == 'success' && format('{0}/.notes', github.workspace) || '' }}

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
